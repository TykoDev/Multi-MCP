# Overlay: use an operator-held sandbox token, secrets/ttk_sandbox_token, instead of the one the sandbox service
# generates into the ttk-sandbox-token volume. `deno task setup` writes the file (64 hex characters); rotate it with
# `deno task setup --only sandbox-token --force`.
#
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d --build
#
# A token of your own needs at least 32 non-whitespace characters.
services:
  tykotech-mcp:
    environment:
      TTK_SANDBOX_TOKEN_FILE: /run/secrets/ttk_sandbox_token
    secrets:
      - ttk_sandbox_token
  sandbox:
    environment:
      TTK_SANDBOX_TOKEN_FILE: /run/secrets/ttk_sandbox_token
    secrets:
      - ttk_sandbox_token
secrets:
  ttk_sandbox_token:
    file: ./secrets/ttk_sandbox_token
