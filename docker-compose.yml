# Multi-MCP (tykotech-mcp): the gateway with its sandboxed Chromium, and the private coding sandbox.
#
#   deno task setup                  # once: secrets/ and .env (see QUICK-START.md)
#   docker compose up -d --build
#   open http://127.0.0.1:8787/
#
# Settings that vary per host live in `.env` (template: .env.example). To serve the LAN, set
# TTK_BIND=0.0.0.0 and TTK_PUBLIC_URL=http://<host address>:8787. A non-loopback bind needs credentials;
# the server refuses to start without them.
#
# State: the `ttk-data` volume holds /data/ttk.db. Every secret stored there is AES-256-GCM sealed with
# secrets/ttk_db_key, which is a Docker secret and never on the volume. Back up both, separately.
#
# Overlays (add with -f): docker-compose.sandbox.yml (your own sandbox token file),
# docker-compose.sandbox-docker.yml (one Docker container per workspace), docker-compose.agents.yml (ACP bridge).

services:
  tykotech-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: tykotech-mcp:0.2.0
    user: '1993:1993'
    ports:
      - '${TTK_BIND:-127.0.0.1}:8787:8787'
    volumes:
      - ttk-data:/data
      # The sandbox's bearer, generated by the sandbox service on its first start; read-only here.
      - ttk-sandbox-token:/run/secrets/ttk-sandbox-token:ro
    # Chromium's default 64 MB /dev/shm kills tabs mid-navigation.
    shm_size: '1gb'
    # The server and every browser session it launches share this limit (Sessions shows each session's share).
    mem_limit: '${TTK_GATEWAY_MEMORY:-1536m}'
    security_opt:
      # Chromium's setuid sandbox helper needs this profile. no-new-privileges is deliberately absent:
      # it would block the helper's setuid step, and the Chromium sandbox is the point.
      - seccomp:./docker/seccomp-chromium.json
    environment:
      TTK_HOST: '0.0.0.0'
      TTK_PORT: '8787'
      # The address clients use. It opens the Host and Origin allowlists to that address.
      TTK_PUBLIC_URL: '${TTK_PUBLIC_URL:-http://127.0.0.1:8787}'
      # Optional overrides. Empty derives both lists from TTK_PUBLIC_URL; a value replaces the derived list.
      TTK_ALLOWED_HOSTS: '${TTK_ALLOWED_HOSTS:-}'
      TTK_ALLOWED_ORIGINS: '${TTK_ALLOWED_ORIGINS:-}'
      TTK_API_KEYS_FILE: /run/secrets/ttk_api_keys
      TTK_ADMIN_USER_FILE: /run/secrets/ttk_admin_user
      TTK_DB_KEY_FILE: /run/secrets/ttk_db_key
      TTK_LOG_LEVEL: info
      # The server's JavaScript heap limit; Chromium's memory is outside it, inside mem_limit above.
      DENO_V8_FLAGS: '--max-old-space-size=${TTK_GATEWAY_HEAP_MB:-1024}'
      # The container's limit, told to the server for the Sessions screen's memory meters (it cannot read cgroup).
      TTK_MEMORY_LIMIT: '${TTK_GATEWAY_MEMORY:-1536m}'
      # The coding sandbox, on the internal network. Its tools need the sandbox:execute scope.
      TTK_SANDBOX_URL: http://sandbox:8080
      TTK_SANDBOX_TOKEN_FILE: /run/secrets/ttk-sandbox-token/token
      # Navigation allowlist; browser_head follows it too:
      # TTK_ALLOWED_DOMAINS: 'example.com,docs.example.com'
      # Seed model providers from a file (copied into the database once, keys sealed). Uncomment this line,
      # its `secrets:` entry below and the top-level `ttk_model_providers` block. Or add providers in the web app.
      # TTK_MODEL_PROVIDERS_FILE: /run/secrets/ttk_model_providers
    secrets:
      - ttk_api_keys
      - ttk_admin_user
      - ttk_db_key
      # Credentials a model types by name without seeing them: uncomment, add
      # TTK_SECRETS_FILE: /run/secrets/ttk_secrets above, and the top-level block. See secrets/README.md.
      # - ttk_secrets
      # - ttk_model_providers
    networks:
      - default
      - sandbox-private
    depends_on:
      sandbox:
        condition: service_healthy
    restart: unless-stopped

  # Private coding sandbox: no published port, reachable only from the gateway. Commands run in
  # bubblewrap cages with no network. Its permission matrix is the CMD in docker/Dockerfile.sandbox.
  sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox
    image: tykotech-sandbox:0.2.0
    user: '1993:1993'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:./docker/seccomp-sandbox.json
      # Fresh /proc mounts inside cages; each cage reinstalls Docker's masks.
      - systempaths=unconfined
    volumes:
      - ttk-code:/work
      # The service writes its bearer here on first start (0400, uid 1993) and reuses it after.
      - ttk-sandbox-token:/run/ttk-sandbox-token
    tmpfs:
      - /tmp/ttk-sandbox:uid=1993,gid=1993,mode=0700,size=64m
    environment:
      TTK_SANDBOX_TOKEN_FILE: /run/ttk-sandbox-token/token
      # Public clones (sandbox_clone) from these exact hosts, through the service's proxy. Empty turns them off.
      TTK_SANDBOX_GIT_HOSTS: github.com,gitlab.com,bitbucket.org,codeberg.org
      # Credentialed remotes: secrets/ttk_git_remotes holds JSON [{"id", "url", "username"?, "token"?}].
      # Uncomment this line, the `secrets:` pair below and the top-level entry. Credentials never enter a cage.
      # TTK_SANDBOX_GIT_REMOTES_FILE: /run/secrets/ttk_git_remotes
    # secrets:
    #   - ttk_git_remotes
    networks:
      - sandbox-private
      # Outbound access for the service's registry and git proxy only; cages have none.
      - sandbox-egress
    mem_limit: 1g
    cpus: 2
    pids_limit: 512
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

secrets:
  ttk_api_keys:
    file: ./secrets/ttk_api_keys.json
  ttk_admin_user:
    file: ./secrets/ttk_admin_user.json
  # 32 random bytes, base64url. Written by `deno task setup`.
  ttk_db_key:
    file: ./secrets/ttk_db_key
  # ttk_secrets:
  #   file: ./secrets/ttk_secrets.json
  # { "version": 1, "providers": [{ "id", "kind", "base_url", "models", "api_key" }] }
  # ttk_model_providers:
  #   file: ./secrets/ttk_model_providers.json
  # Commented: Compose refuses a declared secret whose file is missing.
  # ttk_git_remotes:
  #   file: ./secrets/ttk_git_remotes

volumes:
  ttk-data: {}
  ttk-code: {}
  # Mounted by `sandbox` (read-write) and `tykotech-mcp` (read-only) only.
  ttk-sandbox-token: {}

networks:
  # Gateway <-> sandbox only; nothing on it reaches outside.
  sandbox-private:
    internal: true
  sandbox-egress: {}
