# Multi-MCP (tykotech-mcp), the full stack: the gateway with its sandboxed Chromium, the private coding sandbox, and an
# A2A peer the gateway delegates to. A2A, A2UI, the coding agent (SlopLord), memory and the file share are on.
#
#   deno task setup                  # once: every file below in secrets/, and .env (see secrets/README.md)
#   docker compose up -d --build
#   open http://127.0.0.1:8787/      # sign in as admin with the password setup printed
#
# Host-specific settings live in `.env` (template: .env.example); nothing here needs editing. To serve the LAN, set
# TTK_BIND=0.0.0.0 and TTK_PUBLIC_URL=http://<host address>:8787 there.
#
# State: `ttk-data` holds /data/ttk.db; every secret stored there is AES-256-GCM sealed with secrets/ttk_db_key, a
# Docker secret that is never on the volume. Back up both, separately. `ttk-peer-data` is the peer's own database.
#
# Overlays (add with -f, after this file; `deno task setup` has already written what each one mounts):
#   docker-compose.providers.yml       seed model providers from secrets/ttk_model_providers.json
#   docker-compose.agents.yml          the ACP agent runner (needs your agent in a derived image)
#   docker-compose.sandbox.yml         an operator-held sandbox token instead of the generated one
#   docker-compose.sandbox-docker.yml  one Docker container per coding workspace instead of a bubblewrap cage

services:
  tykotech-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: tykotech-mcp:0.2.0
    user: '1993:1993'
    ports:
      - '${TTK_BIND:-127.0.0.1}:8787:8787'
    volumes:
      - ttk-data:/data
      # The sandbox's bearer, generated by the sandbox service on its first start; read-only here.
      - ttk-sandbox-token:/run/secrets/ttk-sandbox-token:ro
    # Chromium's default 64 MB /dev/shm kills tabs mid-navigation.
    shm_size: '1gb'
    # The server and every browser session it launches share this limit (Sessions shows each session's share).
    mem_limit: '${TTK_GATEWAY_MEMORY:-1536m}'
    security_opt:
      # Chromium's setuid sandbox helper needs this profile. no-new-privileges is deliberately absent:
      # it would block the helper's setuid step, and the Chromium sandbox is the point.
      - seccomp:./docker/seccomp-chromium.json
    environment:
      TTK_HOST: '0.0.0.0'
      TTK_PORT: '8787'
      # The address clients use. It opens the Host and Origin allowlists to that address.
      TTK_PUBLIC_URL: '${TTK_PUBLIC_URL:-http://127.0.0.1:8787}'
      # Optional overrides. Empty derives both lists from TTK_PUBLIC_URL; a value replaces the derived list.
      TTK_ALLOWED_HOSTS: '${TTK_ALLOWED_HOSTS:-}'
      TTK_ALLOWED_ORIGINS: '${TTK_ALLOWED_ORIGINS:-}'
      # Navigation allowlist; browser_head follows it too. Empty: unrestricted.
      TTK_ALLOWED_DOMAINS: '${TTK_ALLOWED_DOMAINS:-}'
      TTK_API_KEYS_FILE: /run/secrets/ttk_api_keys
      TTK_ADMIN_USER_FILE: /run/secrets/ttk_admin_user
      TTK_DB_KEY_FILE: /run/secrets/ttk_db_key
      # Credentials a model types by name without seeing them. `{}` from setup; fill it in, then
      # `docker compose restart tykotech-mcp`. Copied into ttk.db once (secrets/README.md#browser-typed-secrets).
      TTK_SECRETS_FILE: /run/secrets/ttk_secrets
      # The A2A peers `agent_delegate` may reach: the bundled `a2a-peer` below, with the token setup made for it.
      TTK_AGENT_PEERS_FILE: /run/secrets/ttk_agent_peers
      TTK_LOG_LEVEL: info
      # The server's JavaScript heap limit; Chromium's memory is outside it, inside mem_limit above.
      DENO_V8_FLAGS: '--max-old-space-size=${TTK_GATEWAY_HEAP_MB:-1024}'
      # The container's limit, told to the server for the Sessions screen's memory meters (it cannot read cgroup).
      TTK_MEMORY_LIMIT: '${TTK_GATEWAY_MEMORY:-1536m}'
      # The coding sandbox, on the internal network. Its tools need the sandbox:execute scope.
      TTK_SANDBOX_URL: http://sandbox:8080
      TTK_SANDBOX_TOKEN_FILE: /run/secrets/ttk-sandbox-token/token
    secrets:
      - ttk_api_keys
      - ttk_admin_user
      - ttk_db_key
      - ttk_secrets
      - ttk_agent_peers
      - ttk_peer_token
    networks:
      - default
      - sandbox-private
    # The peer is not waited for: a peer that is down fails agent_delegate only, never this service's start.
    depends_on:
      sandbox:
        condition: service_healthy
    restart: unless-stopped

  # Private coding sandbox: no published port, reachable only from the gateway. Commands run in
  # bubblewrap cages with no network. Its permission matrix is the CMD in docker/Dockerfile.sandbox.
  sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox
    image: tykotech-sandbox:0.2.0
    user: '1993:1993'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:./docker/seccomp-sandbox.json
      # Fresh /proc mounts inside cages; each cage reinstalls Docker's masks.
      - systempaths=unconfined
    volumes:
      - ttk-code:/work
      # The service writes its bearer here on first start (0400, uid 1993) and reuses it after.
      - ttk-sandbox-token:/run/ttk-sandbox-token
    tmpfs:
      - /tmp/ttk-sandbox:uid=1993,gid=1993,mode=0700,size=64m
    environment:
      TTK_SANDBOX_TOKEN_FILE: /run/ttk-sandbox-token/token
      # Public clones (sandbox_clone) from these exact hosts, through the service's proxy. Empty turns them off.
      TTK_SANDBOX_GIT_HOSTS: github.com,gitlab.com,bitbucket.org,codeberg.org
      # Credentialed remotes, JSON [{"id", "url", "username"?, "token"?}]. `[]` from setup; fill it in, then
      # `docker compose restart sandbox`. Read once at start; credentials never enter a cage.
      TTK_SANDBOX_GIT_REMOTES_FILE: /run/secrets/ttk_git_remotes
    secrets:
      - ttk_git_remotes
    networks:
      - sandbox-private
      # Outbound access for the service's registry and git proxy only; cages have none.
      - sandbox-egress
    mem_limit: 1g
    cpus: 2
    pids_limit: 512
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # The A2A peer: a second gateway from the same image, with its own browser and database and no published port. The
  # gateway reaches it as http://a2a-peer:8787 with the bearer in secrets/ttk_peer_token; the peer's key file holds only
  # that token's hash, scoped to A2A and its tools. Its public URL is the address the gateway dials, because the peer's
  # agent card must name the origin it was fetched from.
  a2a-peer:
    # Built once, by the tykotech-mcp service above; Compose waits for that build before it starts this.
    image: tykotech-mcp:0.2.0
    user: '1993:1993'
    volumes:
      - ttk-peer-data:/data
    shm_size: '1gb'
    mem_limit: '${TTK_PEER_MEMORY:-1g}'
    security_opt:
      # As the gateway's: the Chromium sandbox helper's profile, and no no-new-privileges.
      - seccomp:./docker/seccomp-chromium.json
    environment:
      TTK_HOST: '0.0.0.0'
      TTK_PORT: '8787'
      TTK_PUBLIC_URL: http://a2a-peer:8787
      TTK_ALLOWED_DOMAINS: '${TTK_ALLOWED_DOMAINS:-}'
      TTK_API_KEYS_FILE: /run/secrets/ttk_peer_api_keys
      TTK_LOG_LEVEL: info
      DENO_V8_FLAGS: '--max-old-space-size=${TTK_PEER_HEAP_MB:-512}'
      TTK_MEMORY_LIMIT: '${TTK_PEER_MEMORY:-1g}'
    secrets:
      - ttk_peer_api_keys
    networks:
      - default
    restart: unless-stopped

# Every file here is written by `deno task setup` (secrets/README.md). Compose refuses a declared secret whose file is
# missing, so run setup before the first `up`.
secrets:
  ttk_api_keys:
    file: ./secrets/ttk_api_keys.json
  ttk_admin_user:
    file: ./secrets/ttk_admin_user.json
  # 32 random bytes, base64url.
  ttk_db_key:
    file: ./secrets/ttk_db_key
  ttk_secrets:
    file: ./secrets/ttk_secrets.json
  ttk_agent_peers:
    file: ./secrets/ttk_agent_peers.json
  ttk_peer_token:
    file: ./secrets/ttk_peer_token
  ttk_peer_api_keys:
    file: ./secrets/ttk_peer_api_keys.json
  ttk_git_remotes:
    file: ./secrets/ttk_git_remotes

volumes:
  ttk-data: {}
  ttk-code: {}
  # Mounted by `sandbox` (read-write) and `tykotech-mcp` (read-only) only.
  ttk-sandbox-token: {}
  ttk-peer-data: {}

networks:
  # Gateway <-> sandbox only; nothing on it reaches outside.
  sandbox-private:
    internal: true
  sandbox-egress: {}
