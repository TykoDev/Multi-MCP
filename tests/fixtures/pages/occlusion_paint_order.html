<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paint Order Occlusion</title>
<style>
*{transition:none!important;animation:none!important;box-sizing:border-box}
html,body{margin:0;padding:0;font:14px/1.4 monospace;background:#fff;color:#000}
main{padding:12px}
.stage{position:relative;width:520px;height:220px;border:1px solid #333;margin-bottom:16px}
.under{position:absolute;left:20px;top:20px;width:200px;height:60px}
.cover{position:absolute;left:0;top:0;width:520px;height:220px;background:#ccc}
.partial{position:absolute;left:120px;top:10px;width:160px;height:100px;background:#fdd;opacity:1}
</style>
</head>
<body>
<main>
<h1>Paint-order occlusion</h1>

<h2>Fully covered by an opaque sibling painted later</h2>
<div class="stage">
  <button class="under" type="button" id="occluded-button">Fully occluded button</button>
  <div class="cover" id="cover-layer">Opaque cover</div>
</div>

<h2>Partially covered</h2>
<div class="stage">
  <button class="under" type="button" id="partly-occluded-button">Partly occluded button</button>
  <div class="partial" id="partial-cover">Partial cover</div>
</div>

<h2>Covered but the cover is pointer-events:none</h2>
<div class="stage">
  <button class="under" type="button" id="pe-none-covered-button">Under pointer-events none</button>
  <div class="cover" id="pe-none-cover" style="pointer-events:none;background:rgba(0,0,0,0.15)">Transparent-to-clicks cover</div>
</div>

<h2>Not covered (control)</h2>
<div class="stage">
  <button class="under" type="button" id="visible-control-button">Unoccluded control button</button>
</div>
</main>
</body>
</html>
