<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scrollable Frame</title>
<style>
*{transition:none!important;animation:none!important;box-sizing:border-box}
html,body{margin:0;padding:0;font:14px/1.4 monospace;background:#f8f8f8;color:#000}
main{padding:8px}
.row{height:60px;border-bottom:1px solid #ccc;padding:4px}
</style>
</head>
<body>
<main>
<div class="row"><button type="button" id="fs-b1">Frame row 1</button></div>
<div class="row"><button type="button" id="fs-b2">Frame row 2</button></div>
<div class="row"><button type="button" id="fs-b3">Frame row 3</button></div>
<div class="row"><button type="button" id="fs-b4">Frame row 4</button></div>
<div class="row"><button type="button" id="fs-b5">Frame row 5</button></div>
<div class="row"><button type="button" id="fs-b6">Frame row 6</button></div>
<div class="row"><button type="button" id="fs-b7">Frame row 7</button></div>
<div class="row"><button type="button" id="fs-b8">Frame row 8</button></div>
<div class="row"><button type="button" id="fs-b9">Frame row 9</button></div>
<div class="row"><button type="button" id="fs-b10">Frame row 10</button></div>
<div class="row"><button type="button" id="fs-b11">Frame row 11</button></div>
<div class="row"><button type="button" id="fs-b12">Frame row 12</button></div>
</main>
</body>
</html>
