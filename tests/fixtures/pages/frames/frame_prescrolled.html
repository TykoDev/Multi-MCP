<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pre-Scrolled Frame</title>
<style>
*{transition:none!important;animation:none!important;box-sizing:border-box}
html,body{margin:0;padding:0;font:14px/1.4 monospace;background:#f8f8f8;color:#000}
main{padding:8px}
.row{height:60px;border-bottom:1px solid #ccc;padding:4px}
</style>
</head>
<body>
<main>
<div class="row"><button type="button" id="fp-b01">Prescroll row 01</button></div>
<div class="row"><button type="button" id="fp-b02">Prescroll row 02</button></div>
<div class="row"><button type="button" id="fp-b03">Prescroll row 03</button></div>
<div class="row"><button type="button" id="fp-b04">Prescroll row 04</button></div>
<div class="row"><button type="button" id="fp-b05">Prescroll row 05</button></div>
<div class="row"><button type="button" id="fp-b06">Prescroll row 06</button></div>
<div class="row"><button type="button" id="fp-b07">Prescroll row 07</button></div>
<div class="row"><button type="button" id="fp-b08">Prescroll row 08</button></div>
<div class="row"><button type="button" id="fp-b09">Prescroll row 09</button></div>
<div class="row"><button type="button" id="fp-b10">Prescroll row 10</button></div>
<div class="row"><button type="button" id="fp-b11">Prescroll row 11</button></div>
<div class="row"><button type="button" id="fp-b12">Prescroll row 12</button></div>
</main>
<script>window.scrollTo(0, 260);</script>
</body>
</html>
