<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page-Level Scroll</title>
<style>
*{transition:none!important;animation:none!important;box-sizing:border-box}
html,body{margin:0;padding:0;font:14px/1.4 monospace;background:#fff;color:#000}
main{padding:12px}
.block{height:400px;border-bottom:1px solid #ccc;padding:8px}
</style>
</head>
<body>
<main>
<h1>Page-level scroll</h1>
<div class="block"><button type="button" id="p-b1">Page block 1</button></div>
<div class="block"><button type="button" id="p-b2">Page block 2</button></div>
<div class="block"><button type="button" id="p-b3">Page block 3</button></div>
<div class="block"><button type="button" id="p-b4">Page block 4</button></div>
<div class="block"><button type="button" id="p-b5">Page block 5</button></div>
<div class="block"><button type="button" id="p-b6">Page block 6</button></div>
<div class="block"><button type="button" id="p-b7">Page block 7</button></div>
<div class="block"><button type="button" id="p-b8">Page block 8</button></div>
<div class="block"><button type="button" id="p-b9">Page block 9</button></div>
<div class="block"><button type="button" id="p-b10">Page block 10</button></div>
</main>
</body>
</html>
