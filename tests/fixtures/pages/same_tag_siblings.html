<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Same-Tag Sibling Indexing</title>
<style>
*{transition:none!important;animation:none!important;box-sizing:border-box}
html,body{margin:0;padding:0;font:14px/1.4 monospace;background:#fff;color:#000}
main{padding:12px}
</style>
</head>
<body>
<main>
<h1>Same-tag siblings</h1>
<section id="sts-a"><p>one</p><span>x</span><p>two</p><p>three</p><span>y</span><p><button type="button" id="sts-b1">Fourth paragraph button</button></p></section>
<section id="sts-b"><button type="button" id="sts-b2">Section two first</button><a id="sts-l1" href="#one" title="First anchor">first anchor</a><button type="button" id="sts-b3">Section two second</button><a id="sts-l2" href="#two" title="Second anchor">second anchor</a></section>
<button type="button" id="sts-tail">Tail</button>
</main>
</body>
</html>
