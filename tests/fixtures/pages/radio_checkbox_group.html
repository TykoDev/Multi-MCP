<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radio Group and Checkboxes</title>
<style>
*{transition:none!important;animation:none!important;box-sizing:border-box}
html,body{margin:0;padding:0;font:14px/1.4 monospace;background:#fff;color:#000}
main{padding:12px}
fieldset{margin:10px 0;width:420px}
label{display:block;margin:4px 0}
</style>
</head>
<body>
<main>
<h1>Radio groups and checkboxes</h1>

<form id="choice-form" name="choiceForm" action="#">

<fieldset id="native-radios">
<legend>Native radio group</legend>
<label><input type="radio" name="shipping" id="r-standard" value="standard" checked> Standard shipping</label>
<label><input type="radio" name="shipping" id="r-express" value="express"> Express shipping</label>
<label><input type="radio" name="shipping" id="r-overnight" value="overnight" disabled> Overnight (unavailable)</label>
</fieldset>

<fieldset id="native-checkboxes">
<legend>Native checkboxes</legend>
<label><input type="checkbox" name="opts" id="c-news" value="news" checked> Newsletter</label>
<label><input type="checkbox" name="opts" id="c-offers" value="offers"> Partner offers</label>
<label><input type="checkbox" name="opts" id="c-indeterminate" value="mixed"> Tri-state (indeterminate)</label>
<label><input type="checkbox" name="opts" id="c-required" value="terms" required> Accept terms</label>
</fieldset>

<fieldset id="aria-radios">
<legend>ARIA radiogroup</legend>
<div role="radiogroup" aria-label="Payment method" id="aria-radiogroup">
  <div role="radio" id="ar-card" aria-checked="true" tabindex="0">Card</div>
  <div role="radio" id="ar-bank" aria-checked="false" tabindex="-1">Bank transfer</div>
  <div role="radio" id="ar-cash" aria-checked="false" tabindex="-1" aria-disabled="true">Cash</div>
</div>
</fieldset>

<fieldset id="aria-checkboxes">
<legend>ARIA checkboxes</legend>
<div role="checkbox" id="ac-one" aria-checked="true" tabindex="0">Aria checkbox checked</div>
<div role="checkbox" id="ac-two" aria-checked="false" tabindex="0">Aria checkbox unchecked</div>
<div role="checkbox" id="ac-mixed" aria-checked="mixed" tabindex="0">Aria checkbox mixed</div>
<div role="switch" id="ac-switch" aria-checked="true" tabindex="0">Aria switch on</div>
</fieldset>

</form>
</main>
<script>
document.getElementById('c-indeterminate').indeterminate = true;
</script>
</body>
</html>
