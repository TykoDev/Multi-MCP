<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cross-Origin Iframe</title>
<style>
*{transition:none!important;animation:none!important;box-sizing:border-box}
html,body{margin:0;padding:0;font:14px/1.4 monospace;background:#fff;color:#000}
main{padding:12px}
iframe{border:1px solid #333;width:520px;height:200px;display:block}
</style>
</head>
<body>
<main>
<h1>Cross-origin iframe</h1>
<p>The frame below is served from a different origin (host <code>localhost</code>, port 38112).</p>
<button id="host-button" type="button">Host page button</button>
<iframe id="xorigin-frame" title="cross origin frame" src="http://localhost:38112/frames/frame_crossorigin_child.html"></iframe>
<button id="after-frame-button" type="button">After frame</button>
</main>
</body>
</html>
