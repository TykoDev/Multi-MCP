<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Same-Site Cross-Origin Iframe</title>
<style>
*{transition:none!important;animation:none!important;box-sizing:border-box}
html,body{margin:0;padding:0;font:14px/1.4 monospace;background:#fff;color:#000}
main{padding:12px}
iframe{border:1px solid #333;width:520px;height:200px;display:block}
</style>
</head>
<body>
<main>
<h1>Same-site, cross-origin iframe</h1>
<p>The frame below is served from port 38112 on the same host (<code>127.0.0.1</code>). Chrome keys site isolation on scheme+site and ignores the port, so this frame stays in the host renderer and arrives inlined through DOM.getDocument rather than as its own session.</p>
<button type="button" id="ssp-host-button">Host page button</button>
<iframe id="ssp-frame" title="same site frame" src="http://127.0.0.1:38112/frames/frame_depth2.html"></iframe>
<button type="button" id="ssp-after-button">After frame</button>
</main>
</body>
</html>
